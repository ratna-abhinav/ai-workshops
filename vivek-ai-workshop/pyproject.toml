[project]
name = "agentic-ai-workshop"
version = "0.1.0"
description = "Agentic AI Workshop - stateful, observable, tool-using, multi-agent, and durable AI systems"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "anyio>=3.7.1",
  "flask>=3.1.3",
  "flask-cors>=6.0.5",
  "grandalf>=0.8",
  "ipykernel>=7.3.0",
  "judge0>=0.0.8",
  "jupyterlab>=4.6.3",
  "langchain>=1.3.18",
  "langchain-openai>=1.6.0",
  "langgraph>=1.2.11",
  "matplotlib>=3.11.1",
  "mlflow[genai]>=3.15.2",
  "networkx>=3.6.1",
  "pydantic>=2.13.5",
  "python-dotenv>=1.2.3",
  "temporalio>=1.32.0",
]

[tool.uv]
package = false
